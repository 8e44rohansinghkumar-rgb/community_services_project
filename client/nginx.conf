# ---------------------------------------------------------------------------
# Serves the built SPA and proxies /api to the API service.
#
# Single origin for both is the point: the browser never makes a cross-origin
# credentialed request, so SameSite=Lax cookies work without exception and CORS
# is not involved in normal operation at all.
#
# TLS is terminated upstream (load balancer / ingress / Caddy). This file
# assumes it is behind something that speaks HTTPS to the outside world.
# ---------------------------------------------------------------------------

upstream civic_api {
    server api:4000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the version.
    server_tokens off;

    # Uploads are limited server-side too; this stops an oversized body from
    # reaching Node at all.
    client_max_body_size 12M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://civic_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The API sets `trust proxy` in production so req.ip — which the rate
        # limiter keys on — reflects the real client rather than this container.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Origin is passed through unmodified: it is genuinely the site's own
        # origin here, and the API's allowlist check depends on it being honest.
        proxy_set_header Origin            $http_origin;
        proxy_set_header Connection        "";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Interactive API documentation, same origin so "Try it out" can use cookies.
    location /docs {
        proxy_pass http://civic_api;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
    }

    # ---- Static assets -----------------------------------------------------
    # Vite emits content-hashed filenames, so these can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---- SPA fallback ------------------------------------------------------
    # Client-side routing: any unmatched path returns index.html so a deep link
    # such as /app/issues/<uuid> works on a hard refresh.
    location / {
        # index.html itself must never be cached, or users get a stale shell
        # pointing at asset filenames that no longer exist after a deploy.
        add_header Cache-Control "no-cache, no-store, must-revalidate";

        # Baseline headers for the document. The API sets its own, stricter,
        # policy on its responses.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        try_files $uri $uri/ /index.html;
    }
}
