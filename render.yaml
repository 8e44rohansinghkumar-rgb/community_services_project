databases:
  - name: civic-connect-db
    databaseName: civic
    user: civic
    plan: free
    region: oregon
    postgresMajorVersion: 16

services:
  # Backend API Web Service
  - type: web
    name: civic-connect-api
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: civic-connect-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "10"
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: UPLOAD_DIR
        value: ./var/uploads
      - key: MAX_FILE_SIZE
        value: "5242880"
      - key: MAX_FILES_PER_ISSUE
        value: "5"
      - key: LOG_LEVEL
        value: info
      - key: DUPLICATE_RADIUS_METERS
        value: "150"
      - key: DUPLICATE_WINDOW_DAYS
        value: "7"
      - key: APP_URL
        fromService:
          type: web
          name: civic-connect
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: civic-connect
          envVarKey: RENDER_EXTERNAL_URL

  # Frontend SPA Static Site
  - type: web
    name: civic-connect
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://civic-connect-api.onrender.com/api/*
      - type: rewrite
        source: /docs/*
        destination: https://civic-connect-api.onrender.com/docs/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
